name: Build KiraLocket Dylib

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "**/*.m"
      - "**/*.h"
      - "Makefile"
      - "KiraLocket.plist"
      - "control"
      - "VERSION"
      - "scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "**/*.m"
      - "**/*.h"
      - "Makefile"
      - "KiraLocket.plist"
      - "control"
      - "VERSION"
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: kiralocket-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 standalone dylib
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # runner.* is unavailable while GitHub validates jobs.<job>.env.
      # Use a fixed writable path outside the checked-out repository instead.
      THEOS: /tmp/theos

    steps:
      - name: Checkout source
        uses: actions/checkout@v4.4.0

      - name: Show Xcode environment
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Install build dependencies and Theos
        run: |
          set -euo pipefail
          brew list ldid >/dev/null 2>&1 || brew install ldid
          brew list xz >/dev/null 2>&1 || brew install xz

          if [[ ! -d "$THEOS/.git" ]]; then
            rm -rf "$THEOS"
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          else
            git -C "$THEOS" fetch --depth=1 origin master
            git -C "$THEOS" reset --hard origin/master
            git -C "$THEOS" submodule update --init --recursive
          fi

      - name: Build and verify dylib
        shell: bash
        run: |
          set -euo pipefail
          # Files uploaded through GitHub's web interface may lose executable bits.
          chmod +x scripts/*.sh
          bash ./scripts/ci-build.sh

      - name: Upload ready files
        uses: actions/upload-artifact@v4
        with:
          name: KiraLocket-arm64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
